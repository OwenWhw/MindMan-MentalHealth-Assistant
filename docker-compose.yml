# ============================================================
# MindMan 一键启动：mysql + redis + backend + frontend
#
#   启动：docker compose up -d --build
#   查看：docker compose ps / docker compose logs -f backend
#   停止：docker compose down            （保留数据）
#   清空：docker compose down -v         （⚠️ 会删除数据库与缓存数据）
#
# 所有敏感配置从同目录的 .env 读取，见 .env.example
# ============================================================

name: mindman

services:
  # ---------------- 服务注册中心（Spring Cloud Alibaba） ----------------
  nacos:
    image: nacos/nacos-server:v2.5.1
    container_name: mindman-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 256m
      JVM_XMN: 128m
    ports:
      # 管理界面只绑定服务器本机；公网仅由前端 Nginx 提供访问
      - "127.0.0.1:${NACOS_PORT:-8848}:8848"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8848/nacos/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s

  # ---------------- 数据库 ----------------
  mysql:
    image: mysql:8.0
    container_name: mindman-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-1234}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mindman}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 仅在数据卷为空时（首次启动）自动执行建表脚本
      - ./code/backend/src/main/resources/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # ---------------- 缓存 ----------------
  redis:
    image: redis:7-alpine
    container_name: mindman-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------------- 后端 ----------------
  backend:
    build:
      context: ./code/backend
    container_name: mindman-backend
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      # ⚠️ 关键：容器之间用「服务名」互相访问，绝不能写 localhost
      #    （容器里的 localhost 指向容器自己，连不到 MySQL）
      #    你项目里配置本来就是 ${MYSQL_HOST:localhost} 占位写法，这里覆盖即可，代码零改动
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mindman}
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-1234}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      NACOS_ENABLED: "true"
      NACOS_SERVER_ADDR: nacos:8848
      # 密钥与第三方 API Key 一律从 .env 注入，不写死进配置
      JWT_SECRET: ${JWT_SECRET}
      AI_PROVIDER: ${AI_PROVIDER:-auto}
      AI_BAILIAN_API_KEY: ${AI_BAILIAN_API_KEY:-}
      # ⚠️ 容器内的 localhost 不是宿主机。要让后端访问宿主机上跑的 Ollama，
      #    必须用 host.docker.internal（Docker Desktop 在 Windows/macOS 上提供）
      AI_OLLAMA_ENABLED: ${AI_OLLAMA_ENABLED:-false}
      AI_OLLAMA_BASE_URL: ${AI_OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      AI_RAG_ENABLED: ${AI_RAG_ENABLED:-false}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      # 等健康检查通过再启动，否则后端会抢在 MySQL 就绪前连库而启动失败
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy

  # ---------------- 前端 ----------------
  frontend:
    build:
      context: ./code/ai-vue
    container_name: mindman-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  mysql-data:
  redis-data:
