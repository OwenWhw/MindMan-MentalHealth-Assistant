# ============================================================
# 开发环境配置（提交到 Git 的版本不含任何真实密钥）
# ------------------------------------------------------------
# 所有 ${XXX:默认值} 会优先读取：
#   1) 操作系统环境变量
#   2) 本地私密文件 application-local.yml（已被 .gitignore 忽略）
#   3) 冒号后面的默认值
# 部署到服务器时，直接设置环境变量即可，无需改本文件。
# ============================================================

# 导入本地私密配置（文件不存在时自动跳过，不会报错）
spring:
  config:
    import: optional:classpath:application-local.yml
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:mindman}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 5000ms

# 阿里云百炼 AI 配置（OpenAI 兼容接口）
ai:
  bailian:
    api-key: ${AI_BAILIAN_API_KEY:}
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    model: qwen3.8-max
    max-tokens: 2048
    temperature: 0.8
    connect-timeout: 10s
    read-timeout: 60s
