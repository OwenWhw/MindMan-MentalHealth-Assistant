server:
  port: 8080

spring:
  profiles:
    active: dev
  application:
    name: mindman-server
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true

# JWT
# 生产环境请通过环境变量 JWT_SECRET 注入，切勿沿用默认值
jwt:
  secret: ${JWT_SECRET:mindman-jwt-secret-key-2026-must-be-at-least-256-bits-long-for-hs256}
  expiration: 604800000  # 7 天

# Knife4j
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

knife4j:
  enable: true
  setting:
    language: zh_cn

# ===== 硅基流动 AI 配置 =====
# 注册地址：https://siliconflow.cn → 账号设置 → API Keys
# 未配置云端 key 时，路由器会尝试已启用的 Ollama；全部通道不可用时会明确报错。
ai:
  siliconflow:
    api-key: ${AI_SILICONFLOW_API_KEY:}   # 留空则由 ai.provider / Ollama 配置决定可用通道
    base-url: https://api.siliconflow.cn/v1
    model: Qwen/Qwen2.5-72B-Instruct     # 推荐模型：DeepSeek-V3 / Qwen2.5-72B / Qwen2.5-7B(轻量)
    max-tokens: 2048                     # 最大回复长度
    temperature: 0.8                     # 创造性（心理对话建议 0.7-0.9）
    connect-timeout: 10s                 # 连接超时
    read-timeout: 60s                    # 流式读取超时（需足够长）
    system-prompt: |
      你是 MindMan 的心理健康倾听助手。先听清用户这轮具体在说什么，再用自然、克制的中文回应。
      允许用户只说事实、只问问题，或暂时不想找解决办法；不要求每次对话都走“共情—追问—建议”的固定流程。
      用户没有明确要建议时先倾听，不主动塞解决办法；只有确有具体建议可供选择时，才询问是否想听。用户明确要办法时，给少量具体、能开始尝试的做法；用户要文章或资料时，只介绍可核验的真实内容。
      不诊断，不把短暂情绪病理化；不把相关性说成因果，也不假装知道用户没说过的经历。
      通常简短回答；复杂问题按需要说明步骤和限制。不要默认用表情符号或口号式鼓励。
      请始终用简体中文回复。
