server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:mindman_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=TRIGGER
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-test.sql
  cloud:
    discovery:
      enabled: false
    service-registry:
      auto-registration:
        enabled: false
    nacos:
      discovery:
        enabled: false
        register-enabled: false
      config:
        enabled: false
  data:
    redis:
      repositories:
        enabled: false

ai:
  bailian:
    api-key:
    provider: auto
  ollama:
    enabled: false
  rag:
    enabled: false

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
