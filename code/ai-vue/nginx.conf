server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # 前端是 Vue SPA（history 路由），刷新子路由时找不到物理文件，
    # 统一回退到 index.html 交给前端路由处理
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端接口反向代理：backend 是 docker compose 里的服务名，
    # 容器之间可以直接用服务名当主机名互相访问
    location /api/ {
        proxy_pass http://backend:8080;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ⚠️ SSE 流式对话的关键：Nginx 默认开启响应缓冲，会把大模型逐字返回的
        #    内容攒成整段再下发，前端"逐字打字"的效果会完全消失。
        #    下面几行关掉缓冲并改用 chunked 传输，流式才能穿透。
        proxy_buffering           off;
        proxy_cache               off;
        proxy_set_header Connection '';
        chunked_transfer_encoding on;

        # 大模型流式响应可能持续较久，读超时给足，否则中途会被断开
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # 带 hash 的静态资源可以放心长缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}
